name: Notify cron (15m)

on:
  schedule:
    # Every 15 minutes, offset from :00 to avoid top-of-hour congestion
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call notify endpoint
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "Missing CRON_URL secret"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET secret"
            exit 1
          fi

          echo "Calling $CRON_URL"
          # --fail makes non-2xx exit non-zero
          # --show-error prints errors, -s keeps it clean
          # retry handles transient failures
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 2 --max-time 20 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$CRON_URL"
          echo ""
          echo "OK"
